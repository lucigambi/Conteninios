<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión de giros · Conteniños</title><style>
@font-face{font-family:Nunito;src:url('assets/vendor/Nunito.ttf')}*{box-sizing:border-box}body{margin:0;padding:30px;background:#10162b;color:white;font:16px Nunito,sans-serif}h1{margin:0 0 10px}p{color:#c8d5ea}button,a{color:inherit}button{background:#23344c;border:1px solid #61728f;padding:10px 18px;border-radius:6px;cursor:pointer}header{display:flex;gap:20px;align-items:center;flex-wrap:wrap}main{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:30px}article{background:#19233a;padding:20px;border-radius:14px;text-align:center}.frame{height:390px;display:flex;align-items:flex-end;border-bottom:1px solid #7aa0ab}.frame img{width:100%;height:100%;object-fit:contain}h2{margin:12px}a{display:block;margin:12px 0;font-size:13px}label{display:block;margin-top:20px}input{vertical-align:middle}small{display:block;margin:10px}body.light{background:#f4f0e7;color:#142331}body.light article{background:white}body.light p{color:#314352}@media(max-width:850px){main{grid-template-columns:1fr 1fr}.frame{height:300px}}@media(prefers-reduced-motion:reduce){.notice{display:block}}
</style><header><div><h1>Ocho vistas. Un mismo eje.</h1><p>Escala original · Centro por pies · Línea de piso común · Sin espejar</p></div><button id="play">Pausar</button><button id="next">Siguiente vista</button><button id="bg">Cambiar fondo</button><a href="index.html">Volver a la landing ↗</a></header><label>Velocidad <input id="speed" type="range" min="120" max="900" value="350"> <span id="speed-value">350 ms</span></label><main></main><script>
const names=['charlie','ed','vamp','alma'];let frame=0,timer,paused=matchMedia('(prefers-reduced-motion:reduce)').matches;
document.querySelector('main').innerHTML=names.map(n=>`<article><h2>${n==='ed'?'ED':n[0].toUpperCase()+n.slice(1)}</h2><div class="frame"><img src="assets/img/giros/${n}/${n}-00.png" alt="Vista de ${n}"></div><small>Vista <span class="number">00</span> / 07</small><a href="assets/img/giros/${n}/hoja-contacto.jpg" target="_blank">Ver hoja de contacto</a>${n==='vamp'?'<a href="assets/img/giros/vamp/defringe-comparacion.jpg" target="_blank">Antes / después del borde</a>':''}</article>`).join('');
names.forEach(n=>{for(let i=0;i<8;i++){const im=new Image();im.src=`assets/img/giros/${n}/${n}-${String(i).padStart(2,'0')}.png`;}});
function next(){frame=(frame+1)%8;document.querySelectorAll('.frame img').forEach((img,i)=>img.src=`assets/img/giros/${names[i]}/${names[i]}-${String(frame).padStart(2,'0')}.png`);document.querySelectorAll('.number').forEach(el=>el.textContent=String(frame).padStart(2,'0'));}
function run(){clearInterval(timer);document.querySelector('#play').textContent=paused?'Reproducir':'Pausar';if(!paused)timer=setInterval(next,Number(document.querySelector('#speed').value));}
document.querySelector('#play').onclick=()=>{paused=!paused;run()};document.querySelector('#next').onclick=()=>{paused=true;run();next()};document.querySelector('#bg').onclick=()=>document.body.classList.toggle('light');document.querySelector('#speed').oninput=e=>{document.querySelector('#speed-value').textContent=e.target.value+' ms';run()};document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInterval(timer);else run()});run();
</script></html>
